<div class="container mt-5">
    
    <h2 class="text-center mb-4">Contact Us</h2>

    <div class="contact-box">

        <form>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" placeholder="Enter first name">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" placeholder="Enter last name">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="Enter email">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-control" placeholder="Enter phone number">
                </div>

                <div class="col-12">
                    <label class="form-label">Subject</label>
                    <input type="text" class="form-control" placeholder="Enter subject">
                </div>

                <div class="col-12">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
                </div>

                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-primary px-5">Send</button>
                </div>

            </div>

        </form>

    </div>

<div class="container mt-4">
  <div class="row">
    <div class="col-md-12">
      <h3 class="text-center mb-3">Our Location</h3>

     <div class="map-container">
  <iframe 
    src="https://www.google.com/maps?q=De+Paul+Institute+of+Science+and+Technology+Angamaly&output=embed"
    width="100%"
    height="300"
    style="border: 20px;;"
    allowfullscreen=""
    loading="lazy">
  </iframe>
</div>
    </div>
  </div>
</div>
</div>
