    <div class="container mt-4 p-4">
        <h2 class="text-center mb-4">COURSES</h2>
<div class="row row-cols-1 row-cols-md-3 g-4">

@for (item of courses; track item.id) {


<div class="col">
<div class="flip">
<div class="front" [style.background-image]="'url(' + item.image + ')'">
<h2 class="text-shadow">{{ item.title }}</h2>
</div>
<div class="back">
<h3>{{ item.title }}</h3>
<p>{{ item.description }}</p>
<a href="" class="btn btn-primary">Read More</a>
</div>
</div>
</div>

} @empty {
<li>There are no items.</li>
}
</div>
</div>
